# ENID en un servidor propio (VPS) con HTTPS automático.
#   1) cp .env.produccion.example .env   y completalo
#   2) docker compose up -d --build
# Guía completa: docs/ONLINE.md
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://enid:${POSTGRES_PASSWORD}@db:5432/enid
      TRUST_PROXY: "1"
      SECURE_COOKIES: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # Recordatorios de clases en vivo: corre cada 10 minutos (no envía nada dos veces).
  # Una vez por día también revisa las membresías en Mercado Pago (respaldo de los webhooks).
  recordatorios:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://enid:${POSTGRES_PASSWORD}@db:5432/enid
      RUN_MIGRATIONS: "0"
    command: ["sh", "-c", "i=0; while true; do flask enviar-recordatorios; if [ $((i % 144)) -eq 0 ]; then flask sincronizar-membresias; fi; i=$((i+1)); sleep 600; done"]
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: enid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: enid
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enid -d enid"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  datos_db:
  caddy_datos:
  caddy_config:
