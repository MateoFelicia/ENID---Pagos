{% extends "base.html" %}

{% block title %}Recuperar contraseña | ENID{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="bg-white text-dark rounded-4 shadow p-4 p-md-5">
                <h1 class="h3 fw-bold mb-4">Recuperar contraseña</h1>
                <p class="text-secondary mb-4">
                    Ingresá tu email y te enviaremos un enlace para restablecer tu contraseña.
                </p>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required maxlength="120" autofocus>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">Enviar enlace</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('iniciar_sesion') }}" class="text-decoration-none">
                        Volver a iniciar sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
