{% extends "base.html" %}

{% block title %}Restablecer contraseña | ENID{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="bg-white text-dark rounded-4 shadow p-4 p-md-5">
                <h1 class="h3 fw-bold mb-4">Nueva contraseña</h1>
                <p class="text-secondary mb-4">
                    Ingresá tu nueva contraseña (mínimo 8 caracteres).
                </p>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" name="confirmar" class="form-control" required minlength="8" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-danger w-100">Actualizar contraseña</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('iniciar_sesion') }}" class="text-decoration-none">
                        Volver a iniciar sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
